name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: js / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: python / ${{ matrix.python }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[all,dev]"
      - run: ruff check src
      - run: mypy src
      - run: pytest

  # The point of this job: prove the core imports with NOTHING else installed.
  # An observability package that drags dependencies into an application is a
  # liability, and this is the only check that catches a stray top-level import.
  python-no-extras:
    name: python / bare install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python -c "import cognipeer_observability; cognipeer_observability.init(enabled=False); print('ok')"
      - name: framework modules fail with a helpful message, not a traceback
        run: |
          python - <<'PY'
          for module, extra in [
              ("cognipeer_observability.langchain", "langchain"),
              ("cognipeer_observability.openai_agents", "openai-agents"),
          ]:
              try:
                  __import__(module)
              except ImportError as error:
                  assert extra in str(error), f"{module}: unhelpful error {error!r}"
              else:
                  raise SystemExit(f"{module} imported without its framework installed")
          print("ok")
          PY

  # Same idea for JS: the core entry point must not reach for a peer.
  js-no-peers:
    name: js / bare install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev --omit=peer
      - run: node -e "const m = require('./dist/index.cjs'); m.init({ enabled: false }); console.log('ok')"
